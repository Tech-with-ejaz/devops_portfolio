version: '3.8'

services:
  portfolio-app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: devops-portfolio:latest
    container_name: portfolio-app-compose
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      - FLASK_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
